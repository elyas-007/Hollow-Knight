# Zote Intro
zoteIntro1=Just what do you think you're doing?! You dare to come between me and my prey?
zoteIntro2=Is it a habit of yours to scurry about, getting in the way and causing bother?
zoteIntro3=I am Zote the Mighty, a knight of great renown. Cross me again, and you'll find out why they call my weapon 'Life Ender'.
zoteIntro4=Now leave me be. I have important work to do.

# Zote Precepts
zotePrecept1='Always Win Your Battles'. Losing a battle earns you nothing and teaches you nothing. Win your battles, or don't engage in them at all!
zotePrecept2='Never Let Them Laugh at You'. Fools laugh at everything, even at their superiors. But beware, laughter isn't harmless!
zotePrecept3='Always Be Rested'. Fighting and adventuring take their toll on your body. When you rest, your body strengthens and repairs itself.
zotePrecept4='Forget Your Past'. The past is painful, and thinking about your past can only bring you misery. Think about something else instead.
zotePrecept5='Strength Beats Strength'. Is your opponent strong? No matter! Simply overcome their strength with even more strength.
zotePrecept6='Choose Your Own Fate'. Our elders teach that our fate is chosen for us before we are even born. I disagree.
zotePrecept7='Mourn Not the Dead'. When we die, do things get better for us or worse? There's no way to tell, so we shouldn't bother mourning.
zotePrecept8='Travel Alone'. You can rely on nobody, and nobody will always be loyal. Therefore, nobody should be your constant companion.
zotePrecept9='Keep Your Home Tidy'. Your home is where you keep your most prized possession - yourself. Therefore, you should make an effort to keep it nice and clean.
zotePrecept10='Keep Your Weapon Sharp'. I make sure that my weapon, 'Life Ender', is kept well-sharpened at all times. This makes it much easier to cut things.

# Charms Descriptions
SOUL_CATCHER_desc=Increases the amount of Soul gained per successful Nail strike on enemies.
DASH_MASTER_desc=Allows the player to dash at much shorter intervals.
UNBREAKABLE_STRENGTH_desc=Strengthens the knight, increasing the damage dealt to enemies through regular Nail strikes.
QUICK_SLASH_desc=Greatly increases attack speed with the Nail and reduces the cooldown after each regular strike.
QUICK_FOCUS_desc=Increases the focus speed for recovering health, shortening the time the player must remain stationary to heal.
HEAVY_BLOW_desc=Increases the knockback force of strikes, causing enemies to be thrown further back after receiving damage.
SHARP_SHADOW_desc=When dashing through enemies, deals damage to them while the player takes no damage. Also increases dash length by 20%.
VOID_HEART_desc=Upgrades the game's abilities. Damage dealt by abilities is increased by 50%, and the upgraded animation for each ability is activated when equipped.
