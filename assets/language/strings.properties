# Cheats UI
cheatsTitle=CHEATS
cheat1=Press [F1] | Boss Arena Teleport: Instantly teleport to the beginning of the boss fight arena.
cheat2=Press [F2] | Noclip / Spectator Mode: Toggle flight and free movement through walls and obstacles without gravity.
cheat3=Press [F3] | Emergency Heal: Instantly receive one health mask (if your health is empty, it will immediately revive you).
cheat4=Press [F4] | Refill Soul Vessel: Instantly and completely refill the soul vessel.
cheat5=Press [F5] | God Mode: Toggle invincibility (complete immunity to enemy attacks and spikes).
cheat6=Press [F6] | Insta-Kill: Toggle the ability to destroy all enemies and bosses with a single strike.

