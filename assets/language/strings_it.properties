# --- Abilities & Cheats ---
abilitiesDesc=SISTEMA ANIMA:\nColpisci i nemici con il tuo Aculeo per raccogliere Anima.\n\nCURA (CONCENTRAZIONE):\nTieni premuto Concentrazione per consumare Anima e curare le tue Maschere della salute.\n\nAMULETI:\nTrova gli Amuleti nascosti ed equipaggiali per migliorare le tue abilità.
cheat1=Premi [F1] | Teletrasporto Boss: Teletrasportati all'inizio dell'arena del boss.
cheat2=Premi [F2] | Modalità Spettatore: Vola e attraversa i muri senza gravità.
cheat3=Premi [F3] | Cura d'Emergenza: Ricevi subito una maschera (ti rianima se sei morto).
cheat4=Premi [F4] | Ricarica Anima: Riempi istantaneamente il contenitore d'anima.
cheat5=Premi [F5] | Modalità Dio: Invincibilità totale contro nemici e spine.
cheat6=Premi [F6] | Uccisione Istantanea: Distruggi tutti i nemici e i boss con un solo colpo.

# --- Zote Dialogue ---
zoteIntro1=Che cosa credi di fare?! Osi metterti tra me e la mia preda?
zoteIntro2=È tua abitudine sgattaiolare in giro, intralciare il passo e dare fastidio?
zoteIntro3=Io sono Zote il Potente, un cavaliere di grande fama. Incrociami di nuovo e scoprirai perché chiamano la mia arma 'Fine della Vita'.
zoteIntro4=Ora lasciami in pace. Ho un lavoro importante da sbrigare.

# --- Zote Precepts ---
zotePrecept1='Vinci Sempre le tue Battaglie'. Perdere una battaglia non ti fa guadagnare né insegnare nulla. Vinci, o non combattere affatto!
zotePrecept2='Non Lasciare Mai che Ridano di Te'. Gli sciocchi ridono di tutto, anche dei loro superiori. Ma attenzione, la risata non è innocua!
zotePrecept3='Sii Sempre Riposato'. Combattere e viaggiare logorano il corpo. Quando riposi, il tuo corpo si rafforza e si ripara.
zotePrecept4='Dimentica il tuo Passato'. Il passato è doloroso e pensarci ti porterà solo tristezza. Pensa ad altro.
zotePrecept5='La Forza Batte la Forza'. Il tuo avversario è forte? Non importa! Supera la sua forza con una forza ancora maggiore.
zotePrecept6='Scegli il tuo Destino'. I nostri anziani insegnano che il nostro destino è scelto prima ancora della nascita. Non sono d'accordo.
zotePrecept7='Non Piangere i Morti'. Quando moriamo, le cose migliorano o peggiorano per noi? Impossibile dirlo, quindi non dovremmo piangere.
zotePrecept8='Viaggia da Solo'. Non puoi contare su nessuno e nessuno sarà sempre leale. Quindi, nessuno dovrebbe essere il tuo compagno.
zotePrecept9='Tieni Pulita la tua Casa'. La tua casa è dove tieni il tuo bene più prezioso: te stesso. Sforzati di tenerla pulita.
zotePrecept10='Tieni Affilata la tua Arma'. Mi assicuro che la mia arma sia sempre affilata. Rende molto più facile tagliare le cose.

# --- Charms Descriptions ---
SOUL_CATCHER_desc=Aumenta la quantità di Anima ottenuta per ogni colpo di Aculeo a segno sui nemici.
DASH_MASTER_desc=Permette al giocatore di scattare (dash) a intervalli molto più brevi.
UNBREAKABLE_STRENGTH_desc=Rafforza il cavaliere, aumentando i danni inflitti ai nemici con i normali colpi di Aculeo.
QUICK_SLASH_desc=Aumenta notevolmente la velocità d'attacco con l'Aculeo e riduce il tempo di ricarica dopo ogni colpo.
QUICK_FOCUS_desc=Aumenta la velocità di concentrazione, riducendo il tempo in cui il giocatore deve restare fermo per curarsi.
HEAVY_BLOW_desc=Aumenta la forza di contraccolpo dei colpi, scaraventando i nemici più lontano dopo aver subito danni.
SHARP_SHADOW_desc=Scattando attraverso i nemici, infligge danni mentre il giocatore non ne subisce. Aumenta la distanza dello scatto del 20%.
VOID_HEART_desc=Migliora le abilità. I danni inflitti dalle abilità aumentano del 50% e si attivano animazioni potenziate.
