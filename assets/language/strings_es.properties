# --- Abilities & Cheats ---
abilitiesDesc=SISTEMA DE ALMA:\nGolpea a los enemigos con tu Aguijón para recolectar Alma.\n\nCURACIÓN (CONCENTRACIÓN):\nMantén pulsado el botón de Concentración para consumir el Alma y restaurar las Máscaras de salud.\n\nAMULETOS:\nEncuentra Amuletos ocultos y equípatelos para mejorar tus habilidades.
cheat1=Pulsa [F1] | Teletransporte al Jefe: Teletranspórtate al inicio de la arena del jefe.
cheat2=Pulsa [F2] | Modo Espectador: Activa el vuelo y el movimiento a través de las paredes sin gravedad.
cheat3=Pulsa [F3] | Curación de Emergencia: Recibe una máscara de salud (te revive si tu salud está vacía).
cheat4=Pulsa [F4] | Rellenar Alma: Rellena la vasija de alma al instante.
cheat5=Pulsa [F5] | Modo Dios: Activa la invencibilidad total contra enemigos y pinchos.
cheat6=Pulsa [F6] | Muerte de un Golpe: Destruye a todos los enemigos y jefes de un solo golpe.

# --- Zote Dialogue ---
zoteIntro1=¡¿Pero qué te has creído que haces?! ¿Te atreves a interponerte entre mi presa y yo?
zoteIntro2=¿Es costumbre en ti corretear por ahí, estorbando y causando molestias?
zoteIntro3=Soy Zote el Todopoderoso, un caballero de gran renombre. Vuelve a cruzarte en mi camino y descubrirás por qué llaman a mi arma 'Terminavidas'.
zoteIntro4=Ahora déjame en paz. Tengo trabajo importante que hacer.

# --- Zote Precepts ---
zotePrecept1='Gana Siempre tus Batallas'. Perder una batalla no te aporta nada ni te enseña nada. ¡Gana tus batallas o no participes en ellas!
zotePrecept2='Nunca Dejes que se Rían de Ti'. Los necios se ríen de todo, incluso de sus superiores. Pero cuidado, ¡la risa no es inofensiva!
zotePrecept3='Descansa Siempre'. Luchar y vivir aventuras pasa factura a tu cuerpo. Cuando descansas, tu cuerpo se fortalece y se repara.
zotePrecept4='Olvida tu Pasado'. El pasado es doloroso y pensar en él solo te traerá miseria. Piensa en otra cosa en su lugar.
zotePrecept5='La Fuerza Vence a la Fuerza'. ¿Es fuerte tu oponente? ¡No importa! Simplemente supera su fuerza con aún más fuerza.
zotePrecept6='Elige tu Propio Destino'. Nuestros mayores nos enseñan que nuestro destino se elige por nosotros antes de nacer. Yo no estoy de acuerdo.
zotePrecept7='No Llores a los Muertos'. Cuando morimos, ¿las cosas mejoran o empeoran? No hay forma de saberlo, así que no deberíamos molestarnos en llorar.
zotePrecept8='Viaja Solo'. No puedes confiar en nadie y nadie será siempre leal. Por lo tanto, nadie debería ser tu compañero constante.
zotePrecept9='Mantén tu Hogar Limpio'. Tu hogar es donde guardas tu posesión más preciada: tú mismo. Por ello, debes esforzarte en mantenerlo bonito y limpio.
zotePrecept10='Mantén tu Arma Afilada'. Me aseguro de que mi arma, 'Terminavidas', esté bien afilada en todo momento. Así es mucho más fácil cortar cosas.

# --- Charms Descriptions ---
SOUL_CATCHER_desc=Aumenta la cantidad de Alma obtenida por cada golpe exitoso con el Aguijón a los enemigos.
DASH_MASTER_desc=Permite al jugador acelerar (dash) en intervalos mucho más cortos.
UNBREAKABLE_STRENGTH_desc=Fortalece al caballero, aumentando el daño infligido a los enemigos con los ataques normales del Aguijón.
QUICK_SLASH_desc=Aumenta enormemente la velocidad de ataque con el Aguijón y reduce el tiempo de recarga tras cada golpe normal.
QUICK_FOCUS_desc=Aumenta la velocidad de concentración para recuperar salud, acortando el tiempo que el jugador debe permanecer inmóvil para curarse.
HEAVY_BLOW_desc=Aumenta la fuerza de retroceso de los ataques, haciendo que los enemigos salgan despedidos más lejos tras recibir daño.
SHARP_SHADOW_desc=Al atravesar enemigos con el dash, les inflige daño mientras el jugador no recibe ninguno. También aumenta la longitud del dash en un 20%.
VOID_HEART_desc=Mejora las habilidades del juego. El daño infligido por las habilidades aumenta un 50%, y se activa la animación mejorada para cada habilidad al equiparlo.
