# Zote Intro
zoteIntro1=Que te crees que estas haciendo?! Te atreves a interponerte entre mi presa y yo?
zoteIntro2=Es un habito tuyo corretear, entrometiendote y causando molestias?
zoteIntro3=Soy Zote el Todopoderoso, un caballero de gran renombre. Cruzate en mi camino otra vez, y descubriras por que llaman a mi arma 'Terminavidas'.
zoteIntro4=Ahora dejame en paz. Tengo trabajo importante que hacer.

# Zote Precepts
zotePrecept1='Siempre Gana Tus Batallas'. Perder una batalla no te da nada ni te ensena nada. Gana tus batallas, o no participes en ellas!
zotePrecept2='Nunca Dejes Que Se Rian De Ti'. Los tontos se rien de todo, incluso de sus superiores. Pero cuidado, la risa no es inofensiva!
zotePrecept3='Descansa Siempre'. Luchar y aventurarse pasan factura a tu cuerpo. Cuando descansas, tu cuerpo se fortalece y se repara.
zotePrecept4='Olvida Tu Pasado'. El pasado es doloroso, y pensar en el solo te traera miseria. Piensa en otra cosa en su lugar.
zotePrecept5='La Fuerza Vence A La Fuerza'. Tu oponente es fuerte? No importa! Simplemente supera su fuerza con aun mas fuerza.
zotePrecept6='Elige Tu Propio Destino'. Nuestros mayores ensenan que nuestro destino se elige antes de nacer. Yo no estoy de acuerdo.
zotePrecept7='No Llores A Los Muertos'. Cuando morimos, las cosas mejoran o empeoran? No hay forma de saberlo, asi que no deberiamos llorar.
zotePrecept8='Viaja Solo'. No puedes confiar en nadie, y nadie sera siempre leal. Por lo tanto, nadie deberia ser tu companero constante.
zotePrecept9='Manten Tu Casa Ordenada'. Tu casa es donde guardas tu posesion mas preciada: tu mismo. Por lo tanto, mantenla limpia.
zotePrecept10='Manten Tu Arma Afilada'. Me aseguro de que mi arma, 'Terminavidas', este siempre bien afilada. Asi es mucho mas facil cortar cosas.

# Charms Descriptions
SOUL_CATCHER_desc=Aumenta la cantidad de Alma obtenida por cada golpe exitoso del Aguijon a los enemigos.
DASH_MASTER_desc=Permite al jugador acelerar en intervalos mucho mas cortos.
UNBREAKABLE_STRENGTH_desc=Fortalece al caballero, aumentando el dano infligido a los enemigos con golpes regulares del Aguijon.
QUICK_SLASH_desc=Aumenta enormemente la velocidad de ataque con el Aguijon y reduce el tiempo de recarga despues de cada golpe regular.
QUICK_FOCUS_desc=Aumenta la velocidad de concentracion para recuperar salud, acortando el tiempo que el jugador debe permanecer inmovil para curarse.
HEAVY_BLOW_desc=Aumenta la fuerza de retroceso de los golpes, haciendo que los enemigos sean arrojados mas atras despues de recibir dano.
SHARP_SHADOW_desc=Al atravesar a los enemigos con el aceleron, les inflige dano mientras el jugador no recibe dano. Tambien aumenta la longitud del aceleron en un 20%.
VOID_HEART_desc=Mejora las habilidades del juego. El dano infligido por las habilidades aumenta en un 50%, y la animacion mejorada de cada habilidad se activa al estar equipado.
