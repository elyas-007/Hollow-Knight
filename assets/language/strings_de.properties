# --- Abilities & Cheats ---
abilitiesDesc=SEELENSYSTEM:\nGreife Feinde mit deinem Nagel an, um Seele zu sammeln.\n\nHEILUNG (FOKUS):\nHalte die Fokus-Taste, um Seele zu verbrauchen und Lebensmasken wiederherzustellen.\n\nAMULETTE:\nFinde Amulette und rüste sie aus, um deine Fähigkeiten zu verbessern.
cheat1=Drücke [F1] | Boss-Teleport: Teleportiere dich sofort zum Bosskampf.
cheat2=Drücke [F2] | Zuschauermodus: Fliege schwerelos durch Wände und Hindernisse.
cheat3=Drücke [F3] | Notheilung: Erhalte sofort eine Lebensmaske (belebt dich wieder, wenn du tot bist).
cheat4=Drücke [F4] | Seele Auffüllen: Fülle das Seelengefäß sofort auf.
cheat5=Drücke [F5] | Gottmodus: Vollständige Unverwundbarkeit gegen Feinde und Stacheln.
cheat6=Drücke [F6] | One-Hit-Kill: Zerstöre alle Feinde und Bosse mit einem einzigen Schlag.

# --- Zote Dialogue ---
zoteIntro1=Was glaubst du eigentlich, was du da tust?! Du wagst es, dich zwischen mich und meine Beute zu stellen?
zoteIntro2=Ist es deine Gewohnheit, herumzuwuseln, im Weg zu stehen und Ärger zu machen?
zoteIntro3=Ich bin Zote der Mächtige, ein Ritter von großem Ruf. Kreuz meinen Weg nochmal und du wirst erfahren, warum man meine Waffe 'Lebensender' nennt.
zoteIntro4=Nun lass mich in Ruhe. Ich habe wichtige Arbeit zu erledigen.

# --- Zote Precepts ---
zotePrecept1='Gewinne immer deine Kämpfe'. Eine Schlacht zu verlieren bringt dir nichts und lehrt dich nichts. Gewinne oder kämpfe erst gar nicht!
zotePrecept2='Lass sie niemals über dich lachen'. Narren lachen über alles, sogar über ihre Vorgesetzten. Aber Vorsicht, Lachen ist nicht harmlos!
zotePrecept3='Sei immer ausgeruht'. Kämpfen und Abenteuer fordern ihren Tribut. Wenn du dich ausruhst, stärkt und repariert sich dein Körper.
zotePrecept4='Vergiss deine Vergangenheit'. Die Vergangenheit ist schmerzhaft, und daran zu denken bringt nur Elend. Denk lieber an etwas anderes.
zotePrecept5='Stärke besiegt Stärke'. Ist dein Gegner stark? Egal! Überwinde seine Stärke einfach mit noch mehr Stärke.
zotePrecept6='Wähle dein eigenes Schicksal'. Unsere Ältesten lehren, dass unser Schicksal bereits vor unserer Geburt feststeht. Ich bin da anderer Meinung.
zotePrecept7='Trauere nicht um die Toten'. Wenn wir sterben, wird es dann besser oder schlechter für uns? Wir können es nicht wissen, also sollten wir nicht trauern.
zotePrecept8='Reise allein'. Du kannst dich auf niemanden verlassen, und niemand wird immer loyal sein. Daher sollte niemand dein ständiger Begleiter sein.
zotePrecept9='Halte dein Zuhause sauber'. In deinem Zuhause bewahrst du deinen wertvollsten Besitz auf - dich selbst. Halte es also sauber.
zotePrecept10='Halte deine Waffe scharf'. Ich sorge dafür, dass meine Waffe stets scharf ist. Das macht das Schneiden von Dingen viel einfacher.

# --- Charms Descriptions ---
SOUL_CATCHER_desc=Erhöht die Menge an Seele, die pro erfolgreichem Nagel-Treffer bei Feinden gewonnen wird.
DASH_MASTER_desc=Erlaubt es dem Spieler, in viel kürzeren Abständen zu sprinten (Dash).
UNBREAKABLE_STRENGTH_desc=Stärkt den Ritter und erhöht den Schaden, der Feinden durch normale Nagel-Treffer zugefügt wird.
QUICK_SLASH_desc=Erhöht die Angriffsgeschwindigkeit mit dem Nagel erheblich und verringert die Abklingzeit nach jedem normalen Treffer.
QUICK_FOCUS_desc=Erhöht die Fokus-Geschwindigkeit, sodass der Spieler zum Heilen weniger lange stillstehen muss.
HEAVY_BLOW_desc=Erhöht die Rückstoßkraft von Treffern, sodass Feinde nach erlittenem Schaden weiter zurückgeworfen werden.
SHARP_SHADOW_desc=Fügt Feinden beim Durchsprinten Schaden zu, ohne selbst welchen zu nehmen. Erhöht die Sprintdistanz um 20%.
VOID_HEART_desc=Verbessert die Fähigkeiten. Der Fähigkeitsschaden wird um 50% erhöht, und verbesserte Animationen werden aktiviert.
