# --- Abilities & Cheats ---
abilitiesDesc=SYSTÈME D'ÂME :\nFrappez les ennemis avec votre Aiguillon pour récolter de l'Âme.\n\nSOIN (CONCENTRATION) :\nMaintenez le bouton de Concentration pour consommer l'Âme et restaurer vos Masques de santé.\n\nCHARMES :\nTrouvez des Charmes cachés et équipez-les pour améliorer vos capacités.
cheat1=Appuyez sur [F1] | Téléportation au Boss : Téléportez-vous au début du combat de boss.
cheat2=Appuyez sur [F2] | Mode Spectateur : Volez et traversez les murs sans gravité.
cheat3=Appuyez sur [F3] | Soin d'Urgence : Recevez un masque de santé (vous réanime si vous êtes mort).
cheat4=Appuyez sur [F4] | Remplir l'Âme : Remplissez complètement la jauge d'âme.
cheat5=Appuyez sur [F5] | Mode Dieu : Invincibilité totale contre les ennemis et les piques.
cheat6=Appuyez sur [F6] | Mort en un Coup : Détruisez les ennemis et les boss en une seule frappe.

# --- Zote Dialogue ---
zoteIntro1=Qu'est-ce que tu crois faire ?! Tu oses t'interposer entre moi et ma proie ?
zoteIntro2=Est-ce dans tes habitudes de te faufiler partout et de déranger le monde ?
zoteIntro3=Je suis Zote le Puissant, un chevalier de grand renom. Croise mon chemin encore une fois et tu sauras pourquoi on appelle mon arme 'Fin de Vie'.
zoteIntro4=Maintenant laisse-moi. J'ai un travail important à faire.

# --- Zote Precepts ---
zotePrecept1='Gagne Toujours tes Combats'. Perdre un combat ne te rapporte rien et ne t'apprend rien. Gagne tes combats ou n'y participe pas !
zotePrecept2='Ne les Laisse Jamais Rire de Toi'. Les imbéciles rient de tout, même de leurs supérieurs. Mais attention, le rire n'est pas inoffensif !
zotePrecept3='Sois Toujours Reposé'. Combattre et voyager épuisent ton corps. Quand tu te reposes, ton corps se renforce et se répare.
zotePrecept4='Oublie ton Passé'. Le passé est douloureux, et y penser ne t'apportera que de la misère. Pense plutôt à autre chose.
zotePrecept5='La Force Bat la Force'. Ton adversaire est fort ? Peu importe ! Dépasse sa force avec encore plus de force.
zotePrecept6='Choisis ton Propre Destin'. Nos aînés nous enseignent que notre destin est choisi avant même notre naissance. Je ne suis pas d'accord.
zotePrecept7='Ne Pleure Pas les Morts'. Quand nous mourons, les choses s'améliorent-elles ou empirent-elles ? Impossible de le savoir, alors inutile de pleurer.
zotePrecept8='Voyage Seul'. Tu ne peux compter sur personne, et personne ne sera toujours loyal. Donc, personne ne devrait être ton compagnon constant.
zotePrecept9='Garde ta Maison Propre'. Ta maison abrite ta possession la plus précieuse : toi-même. Tu dois donc faire un effort pour la garder propre.
zotePrecept10='Garde ton Arme Aiguisée'. Je m'assure que mon arme, 'Fin de Vie', reste bien aiguisée. C'est beaucoup plus facile pour couper des choses.

# --- Charms Descriptions ---
SOUL_CATCHER_desc=Augmente la quantité d'Âme gagnée pour chaque coup d'Aiguillon réussi sur les ennemis.
DASH_MASTER_desc=Permet au joueur d'utiliser la ruée (dash) à des intervalles beaucoup plus courts.
UNBREAKABLE_STRENGTH_desc=Renforce le chevalier, augmentant les dégâts infligés aux ennemis avec les frappes normales de l'Aiguillon.
QUICK_SLASH_desc=Augmente grandement la vitesse d'attaque de l'Aiguillon et réduit le temps de recharge après chaque frappe.
QUICK_FOCUS_desc=Augmente la vitesse de concentration, raccourcissant le temps où le joueur doit rester immobile pour se soigner.
HEAVY_BLOW_desc=Augmente la force de recul des frappes, projetant les ennemis plus loin en arrière après avoir subi des dégâts.
SHARP_SHADOW_desc=En traversant les ennemis avec une ruée, leur inflige des dégâts sans que le joueur n'en subisse. Augmente la distance de la ruée de 20 %.
VOID_HEART_desc=Améliore les compétences du jeu. Les dégâts des compétences sont augmentés de 50 %, et leurs animations sont améliorées.
